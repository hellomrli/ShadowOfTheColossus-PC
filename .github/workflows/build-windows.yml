name: build-windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: MSYS2 CLANG64 toolchain and libraries
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            patch
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross

      - name: Build the port
        shell: msys2 {0}
        run: |
          set -euo pipefail
          # setup-msys2's minimal PATH only has /clang64/bin: add the MSYS2 core utilities.
          export PATH="/usr/bin:/clang64/bin:$PATH"
          # setup-msys2's MSYS2 root is / ; /c/msys64 is another (stale) install on the runner.
          export MSYS2_ROOT=/
          pwd
          command -v clang cmake ninja pkg-config git mkdir bash
          echo "PATH=$PATH"
          bash -c 'echo inner-bash-ok'
          ls -l build.sh
          od -c build.sh | head -2
          bash -x build.sh
          ninja -C out/gpu sotc-live-test recorded-external-test overlay-frame-state-test cpu-usage-test ce-de-sync-test image-expansion-test
          ./out/gpu/sotc-live-test.exe
          ./out/gpu/recorded-external-test.exe
          ./out/gpu/overlay-frame-state-test.exe
          ./out/gpu/cpu-usage-test.exe
          ./out/gpu/ce-de-sync-test.exe
          ./out/gpu/image-expansion-test.exe
          clang -std=c11 -O2 -fomit-frame-pointer -Wall -Wextra -Werror tests/test_win_unwind.c -lntdll -o out/win-unwind-test.exe
          ./out/win-unwind-test.exe
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -Igpu/shadps4 tests/test_cache_blob.cpp gpu/shadps4/video_core/cache_blob.cpp -o out/cache-blob-test.exe
          ./out/cache-blob-test.exe
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread -Igpu/shadps4 tests/test_gpu_diagnostics.cpp -o out/gpu-diagnostics-test.exe
          ./out/gpu-diagnostics-test.exe

      - name: NVIDIA DLSS SDK (headers, import library, runtime)
        shell: pwsh
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/NVIDIA/DLSS.git dlss-sdk
          cd dlss-sdk
          git sparse-checkout set include lib/Windows_x86_64/x64 lib/Windows_x86_64/rel
          cd ..
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git vulkan-headers

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build sotc_dlss.dll (MSVC)
        shell: pwsh
        run: |
          cmake -S gpu/dlss_bridge -B out/dlss-bridge -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DSOTC_DLSS_SDK_ROOT="$env:GITHUB_WORKSPACE\dlss-sdk" `
            -DVULKAN_INCLUDE="$env:GITHUB_WORKSPACE\vulkan-headers\include"
          cmake --build out/dlss-bridge

      - name: Python for the frozen launcher
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: PyInstaller and Pillow
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pyinstaller pillow

      - name: Package SotC-PC.zip
        shell: msys2 {0}
        env:
          # setup-python exports pythonLocation as a Windows path; package_sotc.sh runs it directly.
          WINPYTHON: ${{ env.pythonLocation }}\python.exe
          MSYS2_ROOT: /
          DLSS_SDK_ROOT: ${{ github.workspace }}\dlss-sdk
          DLSS_BRIDGE: out/dlss-bridge/sotc_dlss.dll
        run: |
          set -euo pipefail
          export PATH="/usr/bin:/clang64/bin:$PATH"
          export MSYS2_ROOT=/
          bash packaging/windows/package_sotc.sh

      - name: Smoke test the frozen launcher (no GPU)
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess

          system = Path(os.environ["SystemRoot"])
          env = {**os.environ, "PATH": os.pathsep.join(map(str, (system / "System32", system)))}
          report = Path("out/package-smoke.json").resolve()
          report.unlink(missing_ok=True)
          subprocess.run([
              str(Path("dist/SotC-PC/SotC.exe").resolve()), "--script",
              str(Path("packaging/windows/smoke_launcher.py").resolve()), str(report),
          ], check=True, timeout=60, env=env)
          result = json.loads(report.read_text(encoding="utf-8"))
          assert result["status"] == "ok", result
          print(result)

      - name: Smoke test the native loader (no MSYS2 or GPU)
        shell: python
        run: |
          import ctypes
          import os
          from pathlib import Path
          import subprocess
          import tempfile

          # Missing DLLs must fail, not open a Windows error dialog on the unattended runner.
          ctypes.windll.kernel32.SetErrorMode(0x0001 | 0x0002)
          system = Path(os.environ["SystemRoot"])
          env = {**os.environ, "PATH": os.pathsep.join(map(str, (system / "System32", system)))}
          exe = Path("dist/SotC-PC/bin/bb-probe.exe").resolve()
          with tempfile.TemporaryDirectory() as cwd:
              result = subprocess.run([str(exe)], cwd=cwd, env=env, capture_output=True, timeout=30)
          output = (result.stdout + result.stderr).decode("utf-8", errors="replace")
          print(output)
          assert result.returncode == 1 and "Usage:" in output, (hex(result.returncode), output)

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: SotC-PC-windows
          path: dist/SotC-PC.zip
          if-no-files-found: error
          retention-days: 14
