name: build-windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: MSYS2 CLANG64 toolchain and libraries
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            patch
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross

      - name: Build the port
        shell: msys2 {0}
        run: |
          set -x
          echo "workspace=${GITHUB_WORKSPACE:-unset} pwd=$(pwd)"
          command -v bash || true
          ls -l build.sh
          /usr/bin/bash build.sh

      - name: NVIDIA DLSS SDK (headers, import library, runtime)
        shell: pwsh
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/NVIDIA/DLSS.git dlss-sdk
          cd dlss-sdk
          git sparse-checkout set include lib/Windows_x86_64/x64 lib/Windows_x86_64/rel

      - name: Build sotc_dlss.dll (MSVC)
        shell: pwsh
        run: |
          cmake -S gpu/dlss_bridge -B out/dlss-bridge -G "Visual Studio 17 2022" -A x64 `
            -DSOTC_DLSS_SDK_ROOT="$env:GITHUB_WORKSPACE\dlss-sdk" `
            -DVULKAN_INCLUDE="C:/msys64/clang64/include"
          cmake --build out/dlss-bridge --config Release

      - name: Python for the frozen launcher
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: PyInstaller and Pillow
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pyinstaller pillow

      - name: Package SotC-PC.zip
        shell: msys2 {0}
        env:
          # setup-python exports pythonLocation as a Windows path; package_sotc.sh runs it directly.
          WINPYTHON: ${{ env.pythonLocation }}\python.exe
          MSYS2_ROOT: C:/msys64
          DLSS_SDK_ROOT: ${{ github.workspace }}\dlss-sdk
          DLSS_BRIDGE: out/dlss-bridge/Release/sotc_dlss.dll
        run: |
          set -x
          echo "workspace=${GITHUB_WORKSPACE:-unset} pwd=$(pwd)"
          /usr/bin/bash packaging/windows/package_sotc.sh

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: SotC-PC-windows
          path: dist/SotC-PC.zip
          if-no-files-found: error
          retention-days: 14
