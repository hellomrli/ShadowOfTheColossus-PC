name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Icon conversion dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Python suite (Linux)
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests -v

      # The AppImage and native Linux contract tests are not Windows tests.
      - name: Updater regression tests (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p test_update.py -v

      - name: Preparation cache regression tests (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p test_sotc.py -v

      - name: Executable patch safety tests (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p test_sotc_cpu.py -v

      - name: Launcher regression tests (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p "test_launcher*.py" -v

      - name: Native packaging regression tests (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p test_windows_packaging.py -v

      - name: Standalone live-settings test (no GPU)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -I. tests/test_sotc_live.cpp -o out/sotc-live-test
          env -u SOTC_UPSCALER -u BB_FSR1 out/sotc-live-test 0
          env -u SOTC_UPSCALER BB_FSR1=0 out/sotc-live-test 2
          SOTC_UPSCALER=dlss BB_FSR1=0 out/sotc-live-test 0
          SOTC_UPSCALER=fsr1 out/sotc-live-test 1
          SOTC_UPSCALER=bilinear out/sotc-live-test 2

      - name: Cache blob and crash-context tests (no GPU)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Igpu/shadps4 tests/test_cache_blob.cpp gpu/shadps4/video_core/cache_blob.cpp -o out/cache-blob-test
          out/cache-blob-test
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread -Igpu/shadps4 tests/test_gpu_diagnostics.cpp -o out/gpu-diagnostics-test
          out/gpu-diagnostics-test

      - name: Recorded external calls (no GPU or NGX)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libfmt-dev
          git clone --depth 1 --branch v1.4.357 https://github.com/KhronosGroup/Vulkan-Headers.git out/vulkan-headers
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Wno-unknown-pragmas -Wno-missing-field-initializers \
            -pthread -Igpu/shim -Igpu/shadps4 -isystem out/vulkan-headers/include \
            tests/test_recorded_external.cpp gpu/shadps4/video_core/renderer_vulkan/vk_recorder.cpp \
            gpu/shim/common/logging/log.cpp -lfmt -o out/recorded-external-test
          timeout 30s out/recorded-external-test

      - name: Loading state and CPU telemetry (no GPU)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for test in overlay_frame_state cpu_usage; do
            g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread -I. tests/test_${test}.cpp -o out/${test}-test
            timeout 30s out/${test}-test
          done
